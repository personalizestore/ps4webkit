<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RAW GAME &middot; Poops Chain</title>
<style>
  :root {
    --bg-primary: #07090e;
    --card-bg: rgba(15, 20, 32, 0.85);
    --card-border: rgba(255, 255, 255, 0.08);
    --card-hover-border: rgba(0, 229, 255, 0.35);
    --text-main: #f0f4f8;
    --text-muted: #8b9bb4;
    --text-dim: #546274;
    --accent-cyan: #00e5ff;
    --accent-purple: #8a2be2;
    --accent-ok: #00f5a0;
    --accent-bad: #ff3366;
    --accent-warn: #ffb703;
    --glow-cyan: 0 0 25px rgba(0, 229, 255, 0.35);
    --glow-ok: 0 0 25px rgba(0, 245, 160, 0.35);
    --glow-bad: 0 0 25px rgba(255, 51, 102, 0.35);
    --glow-warn: 0 0 25px rgba(255, 183, 3, 0.35);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: var(--bg-primary);
    background-image:
      radial-gradient(circle at 15% 15%, rgba(0, 229, 255, 0.12) 0%, transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(138, 43, 226, 0.14) 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(20, 28, 45, 0.6) 0%, #07090e 100%);
    background-attachment: fixed;
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    overflow-y: auto;
  }

  /* Header */
  #brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: rgba(11, 15, 25, 0.88);
    border-bottom: 1px solid var(--card-border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .brand-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-logo-wrap {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #00e5ff 0%, #7000ff 100%);
    border-radius: 8px;
    box-shadow: var(--glow-cyan);
  }

  .brand-logo-wrap svg {
    width: 18px;
    height: 18px;
    fill: #ffffff;
  }

  .brand-title {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.12em;
    background: linear-gradient(90deg, #ffffff, #00e5ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
  }

  .brand-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: rgba(138, 43, 226, 0.12);
    border: 1px solid rgba(138, 43, 226, 0.3);
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    color: #c77dff;
    letter-spacing: 0.05em;
  }

  .pulse-dot {
    width: 6px;
    height: 6px;
    background: #c77dff;
    border-radius: 50%;
    box-shadow: 0 0 8px #c77dff;
    animation: pulse 1.8s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(0.95); opacity: 0.8; box-shadow: 0 0 0 0 rgba(199, 125, 255, 0.7); }
    70% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 0 6px rgba(199, 125, 255, 0); }
    100% { transform: scale(0.95); opacity: 0.8; box-shadow: 0 0 0 0 rgba(199, 125, 255, 0); }
  }

  /* Wrap */
  #wrap {
    max-width: 1200px;
    margin: 16px auto;
    padding: 0 18px 40px;
    min-height: calc(100vh - 80px);
  }

  /* Terminal Window */
  .terminal-card {
    display: flex;
    flex-direction: column;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    overflow: hidden;
    margin-bottom: 20px;
  }

  .terminal-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    background: rgba(8, 11, 18, 0.75);
    border-bottom: 1px solid var(--card-border);
  }

  .ps-shapes {
    display: flex;
    gap: 8px;
    font-size: 11px;
    font-weight: 900;
  }
  .ps-triangle { color: #00f5a0; }
  .ps-circle { color: #ff3366; }
  .ps-cross { color: #00e5ff; }
  .ps-square { color: #ff70a6; }

  #state {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #ffffff;
    margin: 0;
    transition: color 0.3s ease;
  }

  #state.ok { color: var(--accent-ok); text-shadow: var(--glow-ok); }
  #state.warn { color: var(--accent-warn); text-shadow: var(--glow-warn); }
  #state.bad { color: var(--accent-bad); text-shadow: var(--glow-bad); }

  .chain-tag {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 6px;
    color: #c77dff;
  }

  /* Monospace Output */
  #out {
    flex: 1;
    white-space: pre-wrap;
    font-family: "JetBrains Mono", "Cascadia Code", "Fira Code", Consolas, monospace;
    font-size: 13px;
    line-height: 1.55;
    background: rgba(5, 8, 14, 0.85);
    padding: 16px 20px;
    overflow-y: auto;
    color: #b0c0d4;
  }

  /* Payload Menu Overlay & Cards - Solid PS4 WebKit Safe */
  #payload-menu-container {
    margin-top: 20px;
    background: #0a0e17;
    border: 1px solid #1c2638;
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
  }

  .payload-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid #1c2638;
    margin-bottom: 18px;
  }

  .payload-header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .payload-header-icon {
    width: 38px;
    height: 38px;
    background: #c77dff;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: #07090e;
  }

  .payload-header-title {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.05em;
    color: #ffffff;
    text-transform: uppercase;
  }

  .payload-header-subtitle {
    font-size: 12px;
    color: #8b9bb4;
  }

  .payload-config-bar {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .config-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #111724;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid #1c2638;
  }

  .config-item label {
    font-size: 11px;
    font-weight: 700;
    color: #546274;
    text-transform: uppercase;
  }

  .config-item input {
    background: transparent;
    border: none;
    color: #c77dff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    width: 85px;
    outline: none;
  }

  .custom-payload-zone {
    margin-bottom: 18px;
  }

  .upload-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 13px;
    background: #111724;
    border: 1.5px dashed #c77dff;
    border-radius: 10px;
    color: #ffffff;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }

  .upload-btn:hover, .upload-btn:focus {
    background: #192337;
    border-color: #e0aaff;
    color: #c77dff;
  }

  .payload-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px;
  }

  .payload-card {
    background: #0d121d;
    border: 1.5px solid #1e283c;
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-decoration: none;
    color: #f0f4f8;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    outline: none;
  }

  .payload-card:hover, .payload-card:focus {
    background: #151d2d;
    border-color: #c77dff;
    box-shadow: 0 0 16px rgba(199, 125, 255, 0.4);
  }

  .payload-card:active {
    background: #1c273d;
    border-color: #00f5a0;
  }

  .payload-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .payload-icon { font-size: 22px; }

  .payload-tag {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    background: #151d2d;
    color: #c77dff;
    border: 1px solid #1e283c;
  }

  .payload-name {
    font-size: 15px;
    font-weight: 800;
    color: #ffffff;
    margin-bottom: 4px;
  }

  .payload-desc {
    font-size: 12px;
    color: #8b9bb4;
    line-height: 1.4;
    margin-bottom: 14px;
    flex: 1;
  }

  .payload-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px;
    background: #151d2d;
    border: 1px solid #c77dff;
    border-radius: 8px;
    color: #c77dff;
    font-size: 12px;
    font-weight: 700;
    pointer-events: none;
  }

  .payload-card:hover .payload-btn, .payload-card:focus .payload-btn {
    background: #8a2be2;
    color: #ffffff;
  }

  .btn-toggle-payloads {
    background: rgba(138, 43, 226, 0.15);
    border: 1px solid rgba(138, 43, 226, 0.35);
    border-radius: 6px;
    color: #c77dff;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .btn-toggle-payloads:hover {
    background: #8a2be2;
    color: #ffffff;
  }
</style>
</head>
<body>

<header id="brand">
  <div class="brand-left">
    <div class="brand-logo-wrap">
      <svg viewBox="0 0 24 24">
        <path d="M19.5 6H4.5C2.57 6 1 7.57 1 9.5v5c0 1.93 1.57 3.5 3.5 3.5h1.6l1.2-2.4c.3-.6.92-1 1.6-1h6.2c.68 0 1.3.4 1.6 1l1.2 2.4h1.6c1.93 0 3.5-1.57 3.5-3.5v-5c0-1.93-1.57-3.5-3.5-3.5zM7.5 12h-1v1c0 .28-.22.5-.5.5s-.5-.22-.5-.5v-1h-1c-.28 0-.5-.22-.5-.5s.22-.5.5-.5h1v-1c0-.28.22-.5.5-.5s.5.22.5.5v1h1c.28 0 .5.22.5.5s-.22.5-.5.5zm10-1.5c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-2 3c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm0-3c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm2 3c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
      </svg>
    </div>
    <span class="brand-title">RAW GAME</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <button class="btn-toggle-payloads" onclick="window.showPayloadMenu()">⚡ PAYLOADS</button>
    <div class="brand-badge">
      <span class="pulse-dot"></span>
      <span>POOPS ACTIVE</span>
    </div>
  </div>
</header>

<div id="wrap">
  <div class="terminal-card">
    <div class="terminal-topbar">
      <div class="ps-shapes">
        <span class="ps-triangle">&#9650;</span>
        <span class="ps-circle">&#9679;</span>
        <span class="ps-cross">&#10005;</span>
        <span class="ps-square">&#9632;</span>
      </div>
      <div id="state">loading poops chain...</div>
      <div class="chain-tag">FW &ge; 12.50</div>
    </div>
    <div id="out"></div>
  </div>

  <!-- Payload Menu Section -->
  <div id="payload-menu-container" style="display:none;">
    <div class="payload-header">
      <div class="payload-header-left">
        <div class="payload-header-icon">⚡</div>
        <div>
          <div class="payload-header-title">Painel de Injeção de Payloads</div>
          <div class="payload-header-subtitle">Envie payloads diretamente para o BinLoader (Porta 9020/9021)</div>
        </div>
      </div>
      <div class="payload-config-bar">
        <div class="config-item">
          <label>IP:</label>
          <input type="text" id="target-ip" value="127.0.0.1">
        </div>
        <div class="config-item">
          <label>Porta:</label>
          <input type="number" id="target-port" value="9020">
        </div>
      </div>
    </div>

    <div class="custom-payload-zone">
      <input type="file" id="custom-payload-file" accept=".bin,.elf" style="display:none;">
      <button class="upload-btn" onclick="document.getElementById('custom-payload-file').click()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/>
        </svg>
        <span>Carregar e Injetar Arquivo Próprio (.BIN / .ELF)</span>
      </button>
    </div>

    <div class="payload-grid"></div>
  </div>
</div>

<script src="payload_injector.js"></script>
<script type="module">import "./chain_poops.js";</script>
</body>
</html>
